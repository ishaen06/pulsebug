services:
  - type: web
    name: pulsebug-backend
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python run_server.py
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        value: sqlite+aiosqlite:///./pulsebug.db
      - key: PYTHON_VERSION
        value: 3.11.8
